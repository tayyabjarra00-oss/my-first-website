<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA | Contact</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="logo">NOVA<span>.</span></div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
        </div>

    </nav>


    <!-- CONTACT -->

    <main class="page">

        <p class="tag">📩 GET IN TOUCH</p>

        <h1>Contact Us.</h1>

        <form class="contact-form" action="#" method="post">

            <input
                type="text"
                name="name"
                id="name"
                placeholder="Your Name"
                required
            >

            <input
                type="email"
                name="email"
                id="email"
                placeholder="Your Email"
                required
            >

            <textarea
                name="message"
                id="message"
                placeholder="Your Message"
                rows="6"
                required
            ></textarea>

            <button type="submit" class="primary">
                Send Message →
            </button>

        </form>

    </main>


    <footer>
        <p>© 2026 NOVA. Built from scratch. 🚀</p>
    </footer>

</body>

</html>
